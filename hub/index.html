<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JetSocio · 跨境电商全链路工具栈</title>
  <meta name="description" content="JetSocio —— 覆盖「被发现、转化、履约、合规」的跨境业务工具栈：GEO PRO、salesbuddy、PackMeta、DocuConsist。" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: "#eef4ff",
              100: "#dbe7ff",
              200: "#bcd0ff",
              400: "#5b8cff",
              500: "#3b6fff",
              600: "#2563eb",
              700: "#1d4ed8",
              800: "#1e3a8a",
            },
          },
          fontFamily: {
            sans: ["system-ui", "-apple-system", "Segoe UI", "Microsoft YaHei", "sans-serif"],
          },
        },
      },
    };
  </  script>
  <style>
    :root {
      --bg: #070b16;
      --bg-soft: #0d1424;
      --line: rgba(120, 160, 255, 0.14);
      --text: #e6ecf5;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }
    * { scroll-behavior: smooth; }
    html, body { background: var(--bg); color: var(--text); }
    body { font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; -webkit-font-smoothing: antialiased; }

    /* layered tech background: subtle grid + drifting glows */
    .tech-bg {
      position: fixed; inset: 0; z-index: -2;
      background:
        radial-gradient(900px 600px at 12% -8%, rgba(56, 189, 248, 0.14), transparent 60%),
        radial-gradient(800px 500px at 100% 0%, rgba(37, 99, 235, 0.16), transparent 55%),
        radial-gradient(700px 700px at 50% 120%, rgba(99, 102, 241, 0.10), transparent 60%),
        var(--bg);
    }
    .tech-grid {
      position: fixed; inset: 0; z-index: -1;
      background-image:
        linear-gradient(rgba(120, 160, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba( 120, 160, 255, 0.05) 1px, transparent 1px);
      background-size: 46px 46px;
      mask-image: radial-gradient(900px 700px at 50% 0%, #000 30%, transparent 80%);
    }
    .card { background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.015)); border: 1px solid var(--line); }
    .glow-ring { box-shadow: 0 0 0 1px rgba(56,189,248,0.18), 0 12px 40px -12px rgba(37,99,235,0.45); }
    .chip { border: 1px solid var(--line); background: rgba(255,255,255,0.04); }
    .btn-primary { background: linear-gradient(135deg, #3b6fff, #2563eb); }
    .btn-ghost { border: 1px solid rgba(120,160,255,0.4); }
    .step-line::before { content: ""; }
    .underline-grow { background-image: linear-gradient(var(--accent), var(--accent)); background-size: 0% 2px; background-repeat: no-repeat; background-position: 0 100%; transition: background-size .3s; }
    .underline-grow:hover { background-size: 100% 2px; }
    @media (prefers-reduced-motion: reduce) { .tech-bg, .tech-grid { animation: none; } }
  </style>
</head>
<body class="min-h-screen">
  <div class="tech-bg"></div>
  <div class="tech-grid"></div>

  <!-- Nav -->
  <header class="sticky top-0 z-30 backdrop-blur-xl bg-[#070b16]/70 border-b border-white/10">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-5 py-4">
      <div class="flex items-center gap-2.5">
        <span class="flex h-9 w-9 items-center justify-center rounded-xl btn-primary font-bold text-white">J</span>
        <span class="text-lg font-semibold tracking-tight">JetSocio</span>
        <span class="hidden sm:inline text-xs text-slate-400">跨境业务工具栈</span>
      </div>
      <nav class="hidden md:flex items-center gap-7 text-sm text-slate-300">
        <a href="#value" class="hover:text-white transition">业务价值</a>
        <a href="#products" class="hover:text-white transition">产品矩阵</a>
        <a href="#chain" class="hover:text-white transition">全链路</a>
      </nav>
      <a href="https://github.com/bluesxxx/geo-pro" target="_blank" rel="noopener"
         class="text-sm font-medium text-white btn-ghost rounded-lg px-4 py-2 hover:bg-white/10 transition">GitHub</a>
    </div>
  </header>

  <!-- Hero -->
  <main class="mx-auto max-w-6xl px-5 pt-16 pb-10">
    <div class="grid lg:grid-cols-2 gap-12 items-center">
      <section class="max-w-xl">
        <span class="chip inline-flex items-center gap-2 rounded-full px-3 py-1 text-xs text-slate-300 mb-5">
          <span class="h-2 w-2 rounded-full bg-emerald-400"></span> 4 款工具 · 一套跨境增长闭环
        </span>
        <h1 class="text-4xl sm:text-5xl font-bold leading-tight tracking-tight">
          从「被 AI 看见」<br />到「顺利签收」
        </h1>
        <p class="mt-5 text-lg text-slate-300 leading-relaxed">
          跨境生意的每一环都在漏钱：<span class="text-white font-medium">没人搜得到你</span>、
          <span class="text-white font-medium">询盘接不住</span>、
          <span class="text-white font-medium">装柜太亏</span>、
          <span class="text-white font-medium">单证被退</span>。
          JetSocio 把四个环节的工具收进一个工作台，让获客、转化、履约、合规一次补齐。
        </p>

        <div class="mt-8 flex flex-wrap gap-4 text-sm">
          <div class="card rounded-xl px-4 py-3">
            <div class="text-2xl font-bold text-white">+20%</div>
            <div class="text-slate-400">装箱空间利用率</div>
          </div>
          <div class="card rounded-xl px-4 py-3">
            <div class="text-2xl font-bold text-white">&lt;5%</div>
            <div class="text-slate-400">单证误报率</div>
          </div>
          <div class="card rounded-xl px-4 py-3">
            <div class="text-2xl font-bold text-white">100%</div>
            <div class="text-slate-400">核心数据自持</div>
          </div>
        </div>
      </section>

      <!-- GEO 体检卡（与 report.js 集成，保持原有 ID） -->
      <section class="card glow-ring rounded-2xl p-6 sm:p-7">
        <h2 class="text-base font-semibold text-white">免费 GEO 体检</h2>
        <p class="mt-1 text-sm text-slate-400">输入网址，30 秒看你的页面是否被 AI 优先引用。</p>
        <form id="audit-form" class="mt-5 space-y-3">
          <label for="audit-url" class="sr-only">网站地址</label>
          <input id="audit-url" type="text" placeholder="example.com"
                 class="w-full rounded-lg bg-black/30 border border-white/15 px-4 py-3 text-white placeholder:text-slate-500 outline-none focus:border-brand-400" />
          <button id="audit-submit" type="submit"
                  class="w-full btn-primary rounded-lg py-3 font-semibold text-white hover:opacity-90 transition">
            免费体检
          </button>
        </form>
        <div id="audit-loading" class="hidden mt-4 text-sm text-slate-400">体检中…</div>
        <div id="audit-report"></div>
      </section>
    </div>

    <!-- Cross-border value chain -->
    <section id="value" class="mt-20">
      <h2 class="text-2xl font-bold text-white">跨境业务，卡在哪一步？</h2>
      <p class="mt-2 text-slate-400 max-w-2xl">四个高频痛点，对应 JetSocio 的四款工具。从流量到签收，每一步都补上。</p>

      <div class="mt-8 grid gap-4 md:grid-cols-4">
        <div class="card rounded-2xl p-5">
          <div class="text-xs uppercase tracking-wider text-brand-400">01 · 获客</div>
          <h3 class="mt-2 font-semibold text-white">没人搜得到你</h3>
          <p class="mt-2 text-sm text-slate-400">买家在 ChatGPT / 豆包 / DeepSeek 问「哪家供应商好」，AI 根本不引用你。</p>
        </div>
        <div class="card rounded-2xl p-5">
          <div class="text-xs uppercase tracking-wider text-brand-400">02 · 转化</div>
          <h3 class="mt-2 font-semibold text-white">询盘接不住</h3>
          <p class="mt-2 text-sm text-slate-400">WhatsApp 消息散落各处，跟进靠记忆，订单在聊天里溜走。</p>
        </div>
        <div class="card rounded-2xl p-5">
          <div class="text-xs uppercase tracking-wider text-brand-400">03 · 履约</div>
          <h3 class="mt-2 font-semibold text-white">装箱太亏</h3>
          <p class="mt-2 text-sm text-slate-400">柜子装不满、危险品隔离靠手算，每一柜都多花冤枉钱。</p>
        </div>
        <div class="card rounded-2xl p-5">
          <div class="text-xs uppercase tracking-wider text-brand-400">04 · 合规</div>
          <h3 class="mt-2 font-semibold text-white">单证被退</h3>
          <p class="mt-2 text-sm text-slate-400">报关单、发票、提单对不上，清关延误、客户信任受损。</p>
        </div>
      </div>
    </section>

    <!-- Product matrix -->
    <section id="products" class="mt-20">
      <h2 class="text-2xl font-bold text-white">产品矩阵</h2>
      <p class="mt-2 text-slate-400 max-w-2xl">每一款都可独立使用，组合在一起构成完整的跨境工作流。</p>

      <div id="chain" class="mt-8 grid gap-5 md:grid-cols-2">
        <!-- GEO PRO -->
        <article class="card rounded-2xl p-6 hover:border-brand-400/50 transition">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
              <span class="flex h-11 w-11 items-center justify-center rounded-xl btn-primary text-white font-bold">G</span>
              <div>
                <h3 class="font-semibold text-white">GEO PRO</h3>
                <p class="text-xs text-slate-400">AI 内容 + GEO 引用优化</p>
              </div>
            </div>
            <span class="chip rounded-full px-3 py-1 text-xs text-brand-200">自托管</span>
          </div>
          <p class="mt-4 text-sm text-slate-300">让 AI 搜索引擎优先引用你的内容。内置知识库、AI 生成、AI 可见性观测与多渠道分发，本地部署、数据完全自持。</p>
          <ul class="mt-4 space-y-2 text-sm text-slate-300">
            <li class="flex gap-2"><span class="text-emerald-400">✓</span> 提升在 LLM 回答中的引用概率</li>
            <li class="flex gap-2"><span class="text-emerald-400">✓</span> 内容生产 → 观测 → 分发闭环</li>
            <li class="flex gap-2"><span class="text-emerald-400">✓</span> 整站零外部 API 依赖</li>
          </ul>
          <a href="https://github.com/bluesxxx/geo-pro" target="_blank" rel="noopener"
             class="mt-5 inline-flex items-center gap-1 text-sm font-medium text-brand-200 hover:text-white underline-grow">查看仓库 →</a>
        </article>

        <!-- salesbuddy -->
        <article class="card rounded-2xl p-6 hover:border-brand-400/50 transition">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
              <span class="flex h-11 w-11 items-center justify-center rounded-xl bg-slate-700 text-white font-bold">S</span>
              <div>
                <h3 class="font-semibold text-white">salesbuddy</h3>
                <p class="text-xs text-slate-400">WhatsApp 私域 CRM（基于 wacrm）</p>
              </div>
            </div>
            <span class="chip rounded-full px-3 py-1 text-xs text-brand-200">开源</span>
          </div>
          <p class="mt-4 text-sm text-slate-300">把 WhatsApp 变成销售中枢：共享收件箱、联系人、销售管道、群发与无代码自动化——自托管、数据归你。</p>
          <ul class="mt-4 space-y-2 text-sm text-slate-300">
            <li class="flex gap-2"><span class="text-emerald-400">✓</span> 询盘自动归集，不再漏回</li>
            <li class="flex gap-2"><span class="text-emerald-400">✓</span> 销售管道可视化跟进</li>
            <li class="flex gap-2"><span class="text-emerald-400">✓</span> 群发 + 自动化工作流</li>
          </ul>
          <a href="https://github.com/ArnasDon/wacrm" target="_blank" rel="noopener"
             class="mt-5 inline-flex items-center gap-1 text-sm font-medium text-brand-200 hover:text-white underline-grow">上游仓库 →</a>
        </article>

        <!-- PackMeta -->
        <article class="card rounded-2xl p-6 hover:border-brand-400/50 transition">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
              <span class="flex h-11 w-11 items-center justify-center rounded-xl bg-cyan-600 text-white font-bold">P</span>
              <div>
                <h3 class="font-semibold text-white">PackMeta</h3>
                <p class="text-xs text-slate-400">3D 装箱优化平台</p>
              </div>
            </div>
            <span class="chip rounded-full px-3 py-1 text-xs text-brand-200">在线</span>
          </div>
          <p class="mt-4 text-sm text-slate-300">上传装箱单，30 秒生成 3D 装柜方案。空间利用率 +20%，IMDG 危险品隔离 / LIFO / 承重校验一键完成。</p>
          <ul class="mt-4 space-y-2 text-sm text-slate-300">
            <li class="flex gap-2"><span class="text-emerald-400">✓</span> 六大行业模板（冷链/化工/大件…）</li>
            <li class="flex gap-2"><span class="text-emerald-400">✓</span> 运费立省、PDF 装柜报告</li>
            <li class="flex gap-2"><span class="text-emerald-400">✓</span> Three.js 3D 预览</li>
          </ul>
          <a href="https://packmeta.pages.dev/" target="_blank" rel="noopener"
             class="mt-5 inline-flex items-center gap-1 text-sm font-medium text-brand-200 hover:text-white underline-grow">访问 Demo →</a>
        </article>

        <!-- DocuConsist -->
        <article class="card rounded-2xl p-6 hover:border-brand-400/50 transition">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
              <span class="flex h-11 w-11 items-center justify-center rounded-xl bg-emerald-600 text-white font-bold">D</span>
              <div>
                <h3 class="font-semibold text-white">DocuConsist</h3>
                <p class="text-xs text-slate-400">外贸单证一致核验</p>
              </div>
            </div>
            <span class="chip rounded-full px-3 py-1 text-xs text-brand-200">在线</span>
          </div>
          <p class="mt-4 text-sm text-slate-300">上传报关单 / 发票 / 提单 / 合同（≤8 份），30 秒跨单「三一致」比对，每条提示可溯源（UCP600 / ISBP）。</p>
          <ul class="mt-4 space-y-2 text-sm text-slate-300">
            <li class="flex gap-2"><span class="text-emerald-400">✓</span> 单证不符 / FOB 责任错配预警</li>
            <li class="flex gap-2"><span class="text-emerald-400">✓</span> OFAC 制裁筛查、运费单核验</li>
            <li class="flex gap-2"><span class="text-emerald-400">✓</span> 误报率 &lt;5%，免费免登录</li>
          </ul>
          <a href="https://docuconsist.com/" target="_blank" rel="noopener"
             class="mt-5 inline-flex items-center gap-1 text-sm font-medium text-brand-200 hover:text-white underline-grow">访问 Demo →</a>
        </article>
      </div>
    </section>

    <!-- Integration band -->
    <section class="mt-16 card glow-ring rounded-2xl p-8 text-center">
      <h2 class="text-xl font-bold text-white">四款工具，一条跨境链路</h2>
      <p class="mt-2 text-slate-300 max-w-2xl mx-auto">
        GEO PRO 帮你被看见 → salesbuddy 把询盘接住 → PackMeta 让每一柜更省 → DocuConsist 守住清关。
        从流量到签收，JetSocio 补齐你今天正在漏掉的每一块钱。
      </p>
      <div class="mt-6 flex flex-wrap justify-center gap-3 text-sm">
        <a href="https://github.com/bluesxxx/geo-pro" target="_blank" rel="noopener"
           class="btn-primary rounded-lg px-5 py-3 font-semibold text-white hover:opacity-90">开始自托管 GEO PRO</a>
        <a href="#products" class="btn-ghost rounded-lg px-5 py-3 font-semibold text-white hover:bg-white/10">浏览全部产品</a>
      </div>
    </section>
  </main>

  <footer class="border-t border-white/10 mt-16">
    <div class="mx-auto max-w-6xl px-5 py-8 text-sm text-slate-500 flex flex-col sm:flex-row justify-between gap-3">
      <span>© JetSocio · 跨境业务工具栈</span>
      <span>GEO PRO 基于 GEOFlow 修改 · salesbuddy 基于 wacrm</span>
    </div>
  </footer>

  <script src="assets/report.js"></script>
</body>
</html>
